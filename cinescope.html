<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineScope — World Movie Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #0f0f1a;
  --card: #13131f;
  --border: #1e1e30;
  --accent: #e63946;
  --accent2: #ffd60a;
  --gold: #c9a84c;
  --text: #eeeef5;
  --muted: #6b6b88;
  --blue: #4cc9f0;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* NOISE TEXTURE OVERLAY */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 0 clamp(16px, 5vw, 60px);
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(8,8,16,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.nav-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem; letter-spacing: 2px;
  color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.nav-logo span { color: var(--accent); }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-link {
  font-size: 0.8rem; font-weight: 500; color: var(--muted);
  cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  transition: color 0.2s; border: none; background: none;
  font-family: 'DM Sans', sans-serif;
}
.nav-link:hover, .nav-link.active { color: var(--text); }
.nav-search-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav-search-btn:hover { color: var(--text); border-color: var(--accent); }

/* SEARCH BAR */
.search-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(8,8,16,0.97);
  display: flex; flex-direction: column; align-items: center;
  padding-top: 120px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.search-overlay.open { opacity: 1; pointer-events: all; }
.search-box {
  width: 100%; max-width: 640px; padding: 0 20px;
  position: relative;
}
.search-input {
  width: 100%; padding: 18px 56px 18px 24px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 16px; color: var(--text);
  font-size: 1.1rem; font-family: 'DM Sans', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.search-close {
  position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
  color: var(--muted); cursor: pointer; font-size: 1.3rem;
  background: none; border: none; color: var(--muted);
}
.search-results {
  width: 100%; max-width: 640px; padding: 16px 20px 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px; max-height: 60vh; overflow-y: auto;
}

/* HERO */
.hero {
  position: relative; height: 100vh; min-height: 600px;
  display: flex; align-items: flex-end;
  padding: 0 clamp(16px, 5vw, 60px) 80px;
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  transition: opacity 0.8s ease;
}
.hero-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg) 0%, rgba(8,8,16,0.6) 40%, rgba(8,8,16,0.2) 100%),
              linear-gradient(to right, var(--bg) 0%, transparent 60%);
}
.hero-content { position: relative; z-index: 1; max-width: 560px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: white;
  font-size: 0.7rem; font-weight: 600; padding: 5px 12px;
  border-radius: 99px; text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 16px; animation: fadeUp 0.6s ease 0.2s both;
}
.hero-title {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(3rem, 8vw, 5.5rem);
  line-height: 0.95; letter-spacing: 2px;
  margin-bottom: 16px;
  animation: fadeUp 0.6s ease 0.4s both;
}
.hero-meta {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 16px; font-size: 0.85rem; color: var(--muted);
  animation: fadeUp 0.6s ease 0.5s both;
}
.hero-rating { color: var(--accent2); font-weight: 700; font-size: 1rem; }
.hero-genre {
  padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--border); font-size: 0.75rem;
  color: var(--muted);
}
.hero-overview {
  font-size: 0.9rem; color: var(--muted); line-height: 1.7;
  max-width: 440px; margin-bottom: 24px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  animation: fadeUp 0.6s ease 0.6s both;
}
.hero-btns { display: flex; gap: 12px; animation: fadeUp 0.6s ease 0.7s both; }
.btn-primary {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 28px; border-radius: 12px;
  background: var(--accent); border: none; color: white;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  text-decoration: none;
}
.btn-primary:hover { background: #c1121f; transform: translateY(-2px); }
.btn-secondary {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 24px; border-radius: 12px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  color: var(--text); font-size: 0.9rem; font-weight: 500; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.2s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.14); }

/* HERO DOTS */
.hero-dots {
  position: absolute; bottom: 32px; right: clamp(16px, 5vw, 60px);
  display: flex; gap: 8px; z-index: 1;
}
.hero-dot {
  width: 6px; height: 6px; border-radius: 99px;
  background: var(--muted); cursor: pointer; transition: all 0.3s;
}
.hero-dot.active { background: var(--accent); width: 24px; }

/* MAIN CONTENT */
main { position: relative; z-index: 1; padding-bottom: 80px; }

/* SECTIONS */
.section { padding: 48px clamp(16px, 5vw, 60px) 0; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.section-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.6rem; letter-spacing: 2px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::before {
  content: ''; display: block;
  width: 4px; height: 24px; background: var(--accent); border-radius: 99px;
}
.see-all {
  font-size: 0.8rem; color: var(--accent); cursor: pointer;
  font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
  border: none; background: none; font-family: 'DM Sans', sans-serif;
  transition: opacity 0.2s;
}
.see-all:hover { opacity: 0.7; }

/* MOVIE ROW */
.movie-row {
  display: flex; gap: 14px;
  overflow-x: auto; padding-bottom: 12px;
  scrollbar-width: none;
}
.movie-row::-webkit-scrollbar { display: none; }

/* MOVIE CARD */
.movie-card {
  flex-shrink: 0; width: 150px; cursor: pointer;
  transition: transform 0.3s; position: relative;
  animation: fadeUp 0.5s ease both;
}
.movie-card:hover { transform: translateY(-8px) scale(1.02); }
.movie-poster {
  width: 150px; height: 220px; border-radius: 14px;
  background: var(--card); object-fit: cover;
  border: 1px solid var(--border);
  display: block; transition: box-shadow 0.3s;
}
.movie-card:hover .movie-poster {
  box-shadow: 0 20px 40px rgba(230,57,70,0.25);
}
.movie-poster-placeholder {
  width: 150px; height: 220px; border-radius: 14px;
  background: linear-gradient(135deg, var(--card), var(--surface));
  border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 8px;
}
.movie-poster-placeholder .film-icon { font-size: 2.5rem; opacity: 0.3; }
.movie-rank {
  position: absolute; top: 8px; left: 8px;
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem; color: white;
  background: var(--accent); padding: 2px 8px; border-radius: 6px;
}
.movie-rating-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  padding: 3px 7px; border-radius: 6px;
  font-size: 0.7rem; font-weight: 700; color: var(--accent2);
  display: flex; align-items: center; gap: 3px;
}
.movie-info { padding: 10px 2px 0; }
.movie-title {
  font-size: 0.82rem; font-weight: 600; line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.movie-year { font-size: 0.72rem; color: var(--muted); }

/* LARGE GRID */
.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.movie-grid .movie-card { width: 100%; }
.movie-grid .movie-poster,
.movie-grid .movie-poster-placeholder { width: 100%; }

/* UPCOMING STRIP */
.upcoming-list { display: flex; flex-direction: column; gap: 12px; }
.upcoming-item {
  display: flex; gap: 14px; align-items: center;
  padding: 14px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s;
  animation: fadeUp 0.4s ease both;
}
.upcoming-item:hover { border-color: var(--accent); transform: translateX(4px); }
.upcoming-thumb {
  width: 60px; height: 88px; border-radius: 10px;
  background: var(--surface); object-fit: cover; flex-shrink: 0;
  border: 1px solid var(--border);
}
.upcoming-info { flex: 1; }
.upcoming-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
.upcoming-date {
  font-size: 0.75rem; color: var(--accent); font-weight: 600;
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.upcoming-genres { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  padding: 3px 8px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 0.68rem; color: var(--muted);
}
.countdown-badge {
  text-align: center; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #c1121f);
  border-radius: 12px; padding: 8px 12px; min-width: 56px;
}
.countdown-num {
  font-family: 'Bebas Neue', cursive; font-size: 1.5rem; line-height: 1;
  color: white;
}
.countdown-label { font-size: 0.6rem; color: rgba(255,255,255,0.7); text-transform: uppercase; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(4,4,10,0.95);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  overflow-y: auto;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card); border-radius: 24px;
  border: 1px solid var(--border);
  width: 100%; max-width: 700px;
  transform: scale(0.94) translateY(20px); transition: transform 0.35s ease;
  overflow: hidden;
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal-backdrop {
  height: 300px; position: relative;
  background-size: cover; background-position: center;
  background-color: var(--surface);
}
.modal-backdrop::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(to top, var(--card) 0%, transparent 60%);
}
.modal-close {
  position: absolute; top: 16px; right: 16px; z-index: 1;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
  color: white; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.modal-close:hover { background: var(--accent); }
.modal-body { padding: 0 24px 28px; position: relative; z-index: 1; }
.modal-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 2.2rem; letter-spacing: 1px; margin-bottom: 8px;
  margin-top: -40px; position: relative; z-index: 1;
}
.modal-meta {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  font-size: 0.82rem; color: var(--muted); margin-bottom: 16px;
}
.modal-rating { color: var(--accent2); font-weight: 700; font-size: 1rem; }
.modal-overview {
  font-size: 0.88rem; line-height: 1.8; color: rgba(238,238,245,0.8);
  margin-bottom: 20px;
}
.modal-section-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px;
  color: var(--muted); margin-bottom: 10px; font-weight: 600;
}
.streaming-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.stream-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px;
  text-decoration: none; font-size: 0.82rem; font-weight: 600;
  transition: all 0.2s; border: 1px solid var(--border);
  color: var(--text); background: var(--surface);
  font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.stream-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.stream-btn.imdb { border-color: var(--accent2); color: var(--accent2); }
.stream-btn.imdb:hover { background: rgba(255,214,10,0.08); }
.modal-trailer-btn {
  width: 100%; padding: 14px; border-radius: 14px;
  background: var(--accent); border: none; color: white;
  font-size: 0.95rem; font-weight: 700; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.modal-trailer-btn:hover { background: #c1121f; }

/* TOAST */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); padding: 12px 24px; border-radius: 99px;
  font-size: 0.85rem; font-weight: 500; z-index: 999;
  opacity: 0; pointer-events: none; transition: all 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* FOOTER */
footer {
  padding: 40px clamp(16px, 5vw, 60px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px; margin-top: 60px;
}
.footer-logo {
  font-family: 'Bebas Neue', cursive; font-size: 1.4rem;
  letter-spacing: 2px; color: var(--muted);
}
.footer-logo span { color: var(--accent); }
.footer-credit { font-size: 0.75rem; color: var(--muted); }
.footer-credit a { color: var(--blue); text-decoration: none; }

/* LOADER */
.loader {
  display: flex; justify-content: center; align-items: center;
  padding: 40px; gap: 8px;
}
.loader-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: bounce 1s ease infinite;
}
.loader-dot:nth-child(2) { animation-delay: 0.15s; }
.loader-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; margin: 48px clamp(16px, 5vw, 60px) 0;
  overflow: hidden;
}
.stat-item {
  flex: 1; padding: 20px; text-align: center;
  border-right: 1px solid var(--border);
  transition: background 0.2s;
}
.stat-item:last-child { border-right: none; }
.stat-item:hover { background: var(--surface); }
.stat-num {
  font-family: 'Bebas Neue', cursive; font-size: 1.8rem;
  color: var(--accent); letter-spacing: 1px;
}
.stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

@keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

/* RESPONSIVE */
@media(max-width:600px) {
  .nav-links { display: none; }
  .stats-bar { display: grid; grid-template-columns: 1fr 1fr; }
  .stat-item:nth-child(2) { border-right: none; }
  .stat-item:nth-child(3) { border-top: 1px solid var(--border); }
  .stat-item:nth-child(4) { border-top: 1px solid var(--border); border-right: none; }
  .modal-backdrop { height: 200px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Cine<span>Scope</span></div>
  <div class="nav-links">
    <button class="nav-link active" onclick="scrollToSection('trending')">Trending</button>
    <button class="nav-link" onclick="scrollToSection('nowplaying')">Now Playing</button>
    <button class="nav-link" onclick="scrollToSection('upcoming')">Upcoming</button>
    <button class="nav-link" onclick="scrollToSection('toprated')">Top Rated</button>
  </div>
  <button class="nav-search-btn" onclick="openSearch()">🔍</button>
</nav>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" placeholder="Search any movie..." autocomplete="off">
    <button class="search-close" onclick="closeSearch()">✕</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content" id="heroContent">
    <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
  </div>
  <div class="hero-dots" id="heroDots"></div>
</div>

<main>
  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="stat-movies">500K+</div><div class="stat-label">Movies</div></div>
    <div class="stat-item"><div class="stat-num" id="stat-shows">140K+</div><div class="stat-label">TV Shows</div></div>
    <div class="stat-item"><div class="stat-num">150+</div><div class="stat-label">Countries</div></div>
    <div class="stat-item"><div class="stat-num">Live</div><div class="stat-label">Updates</div></div>
  </div>

  <!-- TRENDING -->
  <div class="section" id="trending">
    <div class="section-head">
      <div class="section-title">🔥 Trending Now</div>
      <button class="see-all" onclick="loadMore('trending')">See All →</button>
    </div>
    <div class="movie-row" id="trendingRow">
      <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </div>
  </div>

  <!-- NOW PLAYING -->
  <div class="section" id="nowplaying">
    <div class="section-head">
      <div class="section-title">🎬 Now Playing</div>
      <button class="see-all" onclick="loadMore('now_playing')">See All →</button>
    </div>
    <div class="movie-row" id="nowplayingRow">
      <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </div>
  </div>

  <!-- UPCOMING -->
  <div class="section" id="upcoming">
    <div class="section-head">
      <div class="section-title">📅 Upcoming Releases</div>
      <button class="see-all">See All →</button>
    </div>
    <div class="upcoming-list" id="upcomingList">
      <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </div>
  </div>

  <!-- TOP RATED -->
  <div class="section" id="toprated">
    <div class="section-head">
      <div class="section-title">⭐ Top Rated All Time</div>
      <button class="see-all" onclick="loadMore('top_rated')">See All →</button>
    </div>
    <div class="movie-grid" id="topratedGrid">
      <div class="loader" style="grid-column:1/-1"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">Cine<span>Scope</span></div>
  <div class="footer-credit">Powered by <a href="https://www.themoviedb.org" target="_blank">TMDB API</a> · Data updates in real-time</div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-backdrop" id="modalBg">
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_KEY = '8265bd1679663a7ea12ac168da84d2e8'; // Public demo key
const BASE = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/';

let heroMovies = [];
let currentHero = 0;
let heroTimer;

// ── FETCH ──
async function api(endpoint) {
  try {
    const r = await fetch(`${BASE}${endpoint}&api_key=${API_KEY}`);
    return await r.json();
  } catch(e) { return null; }
}

// ── INIT ──
async function init() {
  const [trending, nowPlaying, upcoming, topRated] = await Promise.all([
    api('/trending/movie/week?language=en-US'),
    api('/movie/now_playing?language=en-US&page=1'),
    api('/movie/upcoming?language=en-US&page=1'),
    api('/movie/top_rated?language=en-US&page=1'),
  ]);

  if(trending?.results) {
    heroMovies = trending.results.slice(0, 5);
    renderHero();
    renderRow('trendingRow', trending.results, true);
  }
  if(nowPlaying?.results) renderRow('nowplayingRow', nowPlaying.results);
  if(upcoming?.results) renderUpcoming(upcoming.results);
  if(topRated?.results) renderGrid('topratedGrid', topRated.results);
}

// ── HERO ──
function renderHero() {
  const m = heroMovies[currentHero];
  const bg = document.getElementById('heroBg');
  const content = document.getElementById('heroContent');
  const dots = document.getElementById('heroDots');

  bg.style.backgroundImage = m.backdrop_path
    ? `url(${IMG}original${m.backdrop_path})`
    : 'linear-gradient(135deg, #0f0f1a, #1a0a10)';

  content.innerHTML = `
    <div class="hero-badge">🔥 Trending #${currentHero + 1}</div>
    <h1 class="hero-title">${m.title || m.name}</h1>
    <div class="hero-meta">
      <span class="hero-rating">★ ${m.vote_average?.toFixed(1)}</span>
      <span>${m.release_date?.slice(0,4) || '—'}</span>
      ${(m.genre_ids||[]).slice(0,2).map(g=>`<span class="hero-genre">${genreName(g)}</span>`).join('')}
    </div>
    <p class="hero-overview">${m.overview || 'No overview available.'}</p>
    <div class="hero-btns">
      <button class="btn-primary" onclick="openModal(${m.id})">▶ Details</button>
      <a class="btn-secondary" href="https://www.imdb.com/find?q=${encodeURIComponent(m.title)}" target="_blank">IMDb →</a>
    </div>
  `;

  dots.innerHTML = heroMovies.map((_,i) =>
    `<div class="hero-dot ${i===currentHero?'active':''}" onclick="goHero(${i})"></div>`
  ).join('');

  clearInterval(heroTimer);
  heroTimer = setInterval(() => goHero((currentHero+1) % heroMovies.length), 6000);
}

function goHero(i) { currentHero = i; renderHero(); }

// ── ROWS ──
function renderRow(id, movies, ranked=false) {
  document.getElementById(id).innerHTML = movies.slice(0,15).map((m,i) => movieCard(m, ranked ? i+1 : null)).join('');
}

function renderGrid(id, movies) {
  document.getElementById(id).innerHTML = movies.slice(0,12).map((m,i) => movieCard(m, i+1)).join('');
}

function movieCard(m, rank=null) {
  const poster = m.poster_path
    ? `<img class="movie-poster" src="${IMG}w300${m.poster_path}" alt="${m.title}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="movie-poster-placeholder"><div class="film-icon">🎬</div></div>`;
  return `
    <div class="movie-card" onclick="openModal(${m.id})" style="animation-delay:${(rank||1)*0.05}s">
      <div style="position:relative">
        ${poster}
        ${rank ? `<div class="movie-rank">#${rank}</div>` : ''}
        ${m.vote_average ? `<div class="movie-rating-badge">★ ${m.vote_average.toFixed(1)}</div>` : ''}
      </div>
      <div class="movie-info">
        <div class="movie-title">${m.title || m.name}</div>
        <div class="movie-year">${(m.release_date||m.first_air_date||'').slice(0,4)}</div>
      </div>
    </div>`;
}

// ── UPCOMING ──
function renderUpcoming(movies) {
  const today = new Date();
  document.getElementById('upcomingList').innerHTML = movies.slice(0,6).map((m,i) => {
    const release = new Date(m.release_date);
    const days = Math.max(0, Math.ceil((release - today) / 86400000));
    const thumb = m.poster_path
      ? `<img class="upcoming-thumb" src="${IMG}w154${m.poster_path}" alt="${m.title}" loading="lazy">`
      : `<div class="upcoming-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem">🎬</div>`;
    return `
      <div class="upcoming-item" onclick="openModal(${m.id})" style="animation-delay:${i*0.08}s">
        ${thumb}
        <div class="upcoming-info">
          <div class="upcoming-title">${m.title}</div>
          <div class="upcoming-date">📅 ${m.release_date || 'TBA'}</div>
          <div class="upcoming-genres">
            ${(m.genre_ids||[]).slice(0,3).map(g=>`<span class="tag">${genreName(g)}</span>`).join('')}
          </div>
        </div>
        <div class="countdown-badge">
          <div class="countdown-num">${days > 0 ? days : '—'}</div>
          <div class="countdown-label">${days > 0 ? 'days' : 'out now'}</div>
        </div>
      </div>`;
  }).join('');
}

// ── MODAL ──
async function openModal(id) {
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  const bg = document.getElementById('modalBg');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  body.innerHTML = `<div class="loader" style="padding:30px"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>`;
  bg.style.backgroundImage = '';

  const [detail, providers] = await Promise.all([
    api(`/movie/${id}?language=en-US&append_to_response=videos,credits`),
    api(`/movie/${id}/watch/providers?`)
  ]);

  if(!detail) { body.innerHTML = '<p style="padding:20px;color:var(--muted)">Failed to load.</p>'; return; }

  if(detail.backdrop_path) {
    bg.style.backgroundImage = `url(${IMG}w1280${detail.backdrop_path})`;
  }

  const trailer = detail.videos?.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');
  const cast = (detail.credits?.cast||[]).slice(0,5).map(c=>c.name).join(', ');
  const director = detail.credits?.crew?.find(c=>c.job==='Director')?.name || '—';
  const runtime = detail.runtime ? `${Math.floor(detail.runtime/60)}h ${detail.runtime%60}m` : '—';

  // Streaming platforms
  const streamData = providers?.results?.US?.flatrate || providers?.results?.GB?.flatrate || [];
  const buyData = providers?.results?.US?.buy || [];

  const streamingHTML = streamData.length
    ? streamData.slice(0,4).map(p =>
        `<a class="stream-btn" href="https://www.justwatch.com/us/search?q=${encodeURIComponent(detail.title)}" target="_blank">
          ${p.logo_path ? `<img src="${IMG}w45${p.logo_path}" style="width:20px;height:20px;border-radius:4px;object-fit:cover" alt="">` : '📺'}
          ${p.provider_name}
        </a>`).join('')
    : `<a class="stream-btn" href="https://www.justwatch.com/us/search?q=${encodeURIComponent(detail.title)}" target="_blank">🔍 Find on JustWatch</a>
       <a class="stream-btn" href="https://www.amazon.com/s?k=${encodeURIComponent(detail.title)}" target="_blank">📦 Amazon</a>`;

  body.innerHTML = `
    <h2 class="modal-title">${detail.title}</h2>
    <div class="modal-meta">
      <span class="modal-rating">★ ${detail.vote_average?.toFixed(1)} <span style="color:var(--muted);font-size:0.8rem">(${detail.vote_count?.toLocaleString()} votes)</span></span>
      <span>${detail.release_date?.slice(0,4)||'—'}</span>
      <span>${runtime}</span>
      <span style="color:var(--accent)">${(detail.genres||[]).map(g=>g.name).join(', ') || '—'}</span>
    </div>
    <p class="modal-overview">${detail.overview || 'No overview available.'}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;font-size:0.82rem">
      <div><span style="color:var(--muted)">Director: </span><span>${director}</span></div>
      <div><span style="color:var(--muted)">Language: </span><span>${detail.original_language?.toUpperCase()}</span></div>
      ${cast ? `<div style="grid-column:1/-1"><span style="color:var(--muted)">Cast: </span><span>${cast}</span></div>` : ''}
    </div>
    <div class="modal-section-label">Where to Watch</div>
    <div class="streaming-links">
      ${streamingHTML}
      <a class="stream-btn imdb" href="https://www.imdb.com/find?q=${encodeURIComponent(detail.title)}" target="_blank">⭐ IMDb</a>
    </div>
    ${trailer
      ? `<a class="modal-trailer-btn" href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank">▶ Watch Trailer on YouTube</a>`
      : `<button class="modal-trailer-btn" onclick="searchTrailer('${detail.title}')">🔍 Search Trailer</button>`
    }
  `;
}

function searchTrailer(title) {
  window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(title+' official trailer')}`, '_blank');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function handleOverlayClick(e) {
  if(e.target === document.getElementById('modalOverlay')) closeModal();
}

// ── SEARCH ──
let searchTimer;
function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  document.getElementById('searchInput').focus();
  document.body.style.overflow = 'hidden';
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
  document.body.style.overflow = '';
}
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if(!q) { document.getElementById('searchResults').innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    const data = await api(`/search/movie?query=${encodeURIComponent(q)}&language=en-US&page=1`);
    if(!data?.results) return;
    document.getElementById('searchResults').innerHTML = data.results.slice(0,12).map(m => movieCard(m)).join('');
  }, 400);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') { closeSearch(); closeModal(); } });

// ── LOAD MORE ──
async function loadMore(type) {
  showToast('Loading more...');
  const data = await api(`/movie/${type}?language=en-US&page=2`);
  if(data?.results) showToast(`Loaded ${data.results.length} more movies`);
}

// ── SCROLL ──
function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── GENRES ──
const GENRES = {28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Sci-Fi',10770:'TV Movie',53:'Thriller',10752:'War',37:'Western'};
function genreName(id) { return GENRES[id] || 'Other'; }

// ── START ──
init();
</script>
</body>
</html>
